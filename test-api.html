<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI配置测试</title>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 600px; margin: 0 auto; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .result { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 4px; }
    .success { color: green; }
    .error { color: red; }
    pre { white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>AI配置测试页面</h1>
  
  <h3>1. 获取当前配置状态</h3>
  <button onclick="getStatus()">获取状态</button>
  <div id="statusResult" class="result"></div>
  
  <h3>2. 测试AI连接</h3>
  <button onclick="testAI('zhipu')">测试智谱AI</button>
  <button onclick="testAI('deepseek')">测试DeepSeek</button>
  <div id="testResult" class="result"></div>

  <script>
    const API_BASE = 'http://localhost:3456/api';
    
    async function getStatus() {
      try {
        const res = await fetch(`${API_BASE}/config/ai`);
        const data = await res.json();
        document.getElementById('statusResult').innerHTML = 
          '<pre class="' + (data.success ? 'success' : 'error') + '">' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (err) {
        document.getElementById('statusResult').innerHTML = 
          '<pre class="error">请求失败: ' + err.message + '</pre>';
      }
    }
    
    async function testAI(provider) {
      document.getElementById('testResult').innerHTML = '测试中...';
      try {
        const res = await fetch(`${API_BASE}/config/ai/test`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider })
        });
        const data = await res.json();
        document.getElementById('testResult').innerHTML = 
          '<pre class="' + (data.success ? 'success' : 'error') + '">' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (err) {
        document.getElementById('testResult').innerHTML = 
          '<pre class="error">请求失败: ' + err.message + '</pre>';
      }
    }
  </script>
</body>
</html>
