<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XX单车 - 官方商城（Widget 演示页）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f8fa; color: #333; }
    .nav { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; }
    .nav .logo { font-size: 18px; font-weight: 700; color: #2563eb; }
    .nav .links a { margin-left: 20px; color: #6b7280; text-decoration: none; font-size: 14px; }
    .hero { text-align: center; padding: 80px 20px 60px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; }
    .hero h1 { font-size: 36px; margin-bottom: 16px; }
    .hero p { font-size: 16px; opacity: 0.85; }
    .products { max-width: 1000px; margin: 40px auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 20px; }
    .product { background: #fff; border-radius: 12px; padding: 24px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .product .icon { font-size: 48px; margin-bottom: 12px; }
    .product h3 { font-size: 16px; margin-bottom: 8px; }
    .product p { font-size: 13px; color: #6b7280; margin-bottom: 12px; }
    .product .price { color: #ef4444; font-weight: 700; font-size: 18px; }
    .footer { text-align: center; padding: 30px; color: #9ca3af; font-size: 13px; }
    .demo-bar { max-width: 1000px; margin: 20px auto; padding: 0 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .demo-bar button { padding: 8px 16px; border: 1px solid #d1d5db; background: #fff; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .15s; }
    .demo-bar button:hover { border-color: #2563eb; color: #2563eb; }
    .demo-bar code { background: #f3f4f6; padding: 3px 8px; border-radius: 6px; font-size: 12px; color: #374151; }
  </style>
</head>
<body>

  <!-- 模拟业务网站 -->
  <div class="nav">
    <div class="logo">🚲 XX单车官方商城</div>
    <div class="links">
      <a href="#">首页</a>
      <a href="#">车辆</a>
      <a href="#">会员</a>
      <a href="#">帮助中心</a>
    </div>
  </div>

  <div class="hero">
    <h1>骑行，让城市更美好</h1>
    <p>扫码即骑 · 全城畅行 · 7×24 小时智能客服在线</p>
  </div>

  <!-- 演示操作区：测试 CSWidget API -->
  <div class="demo-bar">
    <span style="font-size:13px;color:#6b7280;align-self:center;">Widget 通信测试：</span>
    <button onclick="CSWidget && CSWidget.open()">open()</button>
    <button onclick="CSWidget && CSWidget.close()">close()</button>
    <button onclick="CSWidget && CSWidget.send('你们的工作时间是几点？')">send('工作时间')</button>
    <button onclick="CSWidget && CSWidget.send('我的车没电了怎么办')">send('车辆没电')</button>
    <button onclick="CSWidget && CSWidget.setUser({name:'张先生'})">setUser()</button>
    <code>嵌入代码：&lt;script src="/widget/widget.js"&gt;&lt;/script&gt;</code>
  </div>

  <div class="products">
    <div class="product"><div class="icon">🚲</div><h3>经典城市车</h3><p>轻便耐用，城市通勤首选</p><div class="price">¥1.5/30分钟</div></div>
    <div class="product"><div class="icon">⚡</div><h3>电动助力车</h3><p>助力续航 60km，爬坡轻松</p><div class="price">¥2.5/30分钟</div></div>
    <div class="product"><div class="icon">🛴</div><h3>共享滑板车</h3><p>最后一公里神器</p><div class="price">¥2.0/次</div></div>
  </div>

  <div class="footer">© 2026 XX单车科技有限公司 · 演示页面（widget 嵌入测试）</div>

  <!-- ===== 一行代码接入 Chat Widget ===== -->
  <script src="/widget/widget.js" data-title="XX单车客服" data-logo="🚲" data-color="#2563eb"></script>
</body>
</html>
