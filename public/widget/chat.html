<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title id="page-title">AI智能客服</title>
    
  <link rel="stylesheet" href="/css/theme.css?v=20260806">
  <link rel="stylesheet" href="/css/chat.css?v=20260806">
  <link rel="stylesheet" href="/widget/widget.css?v=20260806">
</head>
<body>
<div class="chat-wrap">
  <!-- 头部 -->
  <div class="header">
    <div class="header-info">
      <div class="avatar" id="brand-logo">🤖</div>
      <div>
        <h1 id="brand-name">AI智能客服</h1>
        <div class="status-indicator">
          <span class="status-dot active" id="status-dot"></span>
          <span id="status-text">会话活跃中</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn-min" onclick="minimizeWidget()" title="最小化">−</button>
      <button class="header-btn" onclick="clearChat()">清空</button>
      <button class="header-btn" onclick="endConversation()" id="end-btn">结束</button>
      <button class="header-btn" onclick="showRating()">评价</button>
    </div>
  </div>

  <!-- 快捷问题 -->
  <div class="quick-questions">
    <p>常见问题快速提问：</p>
    <div class="quick-tags" id="quick-tags">
      <!-- 动态加载 -->
    </div>
  </div>

  <!-- 消息区 -->
  <div class="messages" id="messages">
    <!-- 欢迎消息（动态加载） -->
  </div>

  <!-- 输入区 -->
  <div class="input-area">
    <div class="input-row">
      <textarea id="msg-input" placeholder="输入您的问题..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMsg()">
        <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
      </button>
    </div>
    <div class="hint" id="footer-hint">Enter 发送 · Shift+Enter 换行</div>
  </div>
</div>

<!-- 评价弹窗 -->
<div id="rating-modal" class="modal-overlay hidden">
  <div class="rating-box">
    <h3>本次服务评价</h3>
    <p>您的反馈帮助我们持续改进</p>
    <div class="emojis">
      <button class="emoji-btn" data-score="1" onclick="selectScore(this)">😞</button>
      <button class="emoji-btn" data-score="2" onclick="selectScore(this)">😐</button>
      <button class="emoji-btn" data-score="3" onclick="selectScore(this)">🙂</button>
      <button class="emoji-btn" data-score="4" onclick="selectScore(this)">😊</button>
      <button class="emoji-btn" data-score="5" onclick="selectScore(this)">😍</button>
    </div>
    <textarea class="rating-comment" id="rating-comment" placeholder="留下您的建议（选填）..." rows="3"></textarea>
    <button class="submit-btn" onclick="submitRating()">提交评价</button>
    <button class="cancel-btn" onclick="skipRating()">暂不评价</button>
  </div>
</div>

<script>
  // API 地址自动适配：生产环境用当前域名，开发环境用 localhost
  // 生产部署时直接用相对路径（和前端同域）或通过环境变量注入
  // widget 版 API：优先用父页面注入的 apiUrl（跨域部署），否则同域自动检测
  const API = (function () {
    const injected = sessionStorage.getItem('csw_api') || '';
    if (injected) return injected;
    const envUrl = (window.__ENV__ && window.__ENV__.VITE_API_URL) || '';
    if (envUrl) return envUrl;
    const port = location.port;
    if (port === '3456') return location.origin + '/api';
    return location.origin + '/api';
  })();
  let convId = null;
  let isBusy = false;
  let selectedScore = 0;
  let ratingTimer = null;
  let hasTriggeredRating = false;
  let conversationStatus = 'active'; // active, idle, closed
  let conversationMode = 'ai'; // ai, queue, human
  let statusCheckTimer = null;
  let ws = null; // WebSocket连接
  let currentAgent = null; // 当前分配的客服
  let queuePosition = 0; // 排队位置
  const visitorId = getOrCreateVisitorId();
  const RATING_DELAY = 60000; // 1分钟自动触发评价
  const STATUS_CHECK_INTERVAL = 10000; // 10秒检查一次会话状态

  // ========== 品牌配置 ==========
  let Brand = {}; // 全局品牌配置

  async function loadBrandConfig() {
    try {
      const res = await fetch(API + '/config/brand');
      const d = await res.json();
      if (d.success && d.data) {
        Brand = d.data;
        applyBrandConfig(Brand);
      }
    } catch (e) {
      logErr('[品牌] 加载失败，使用默认配置:', e);
    }
  }

  function applyBrandConfig(b) {
    // 1. 页面标题
    document.title = b.name || 'AI智能客服';
    document.getElementById('page-title').textContent = b.name || 'AI智能客服';
    
    // 2. 头部
    document.getElementById('brand-name').textContent = b.name || 'AI智能客服';
    document.getElementById('brand-logo').textContent = b.logo || '🤖';

    // 3. CSS变量（主题色）
    document.documentElement.style.setProperty('--primary', b.primaryColor || '#2563eb');
    document.documentElement.style.setProperty('--primary-dark', b.headerGradientEnd || '#1d4ed8');
    document.documentElement.style.setProperty('--primary-light', lightenColor(b.primaryColor || '#2563eb', 40));
    document.documentElement.style.setProperty('--primary-bg', lightenColor(b.primaryColor || '#2563eb', 90));

    // 4. 快捷问题
    renderQuickQuestions(b.quickQuestions);

    // 5. 欢迎消息
    const welcomeMsg = (b.welcomeMessage || '')
      .replace('{botName}', b.botName || '小智')
      .replace('{name}', b.name || '');
    
    document.getElementById('messages').innerHTML = `
      <div class="msg">
        <div class="msg-avatar bot">${escapeHtml(b.logo || '🤖')}</div>
        <div class="msg-body">
          <div class="bubble bot">${escapeHtml(welcomeMsg)}</div>
          <div class="msg-meta">刚刚</div>
        </div>
      </div>`;

    // 6. 输入框placeholder
    document.getElementById('msg-input').placeholder = b.placeholder || '输入您的问题...';
    
    // 7. 底部提示
    document.getElementById('footer-hint').textContent = b.footerHint || 'Enter 发送 · Shift+Enter 换行';

    // 8. 评价弹窗标题
    // （在showRating函数中动态设置）

    log('[品牌] 配置已应用:', b.name);
  }

  function renderQuickQuestions(questions) {
    const container = document.getElementById('quick-tags');
    container.innerHTML = '';
    
    if (!questions || questions.length === 0) return;
    
    questions.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'quick-tag';
      btn.textContent = q.text;
      
      if (q.action === 'request_human') {
        btn.onclick = () => requestHuman();
      } else if (q.question) {
        btn.onclick = () => quickAsk(q.question);
      }
      
      container.appendChild(btn);
    });
  }

  // 简单的颜色变亮工具
  function lightenColor(hex, percent) {
    hex = hex.replace('#', '');
    const r = parseInt(hex.substring(0,2), 16);
    const g = parseInt(hex.substring(2,4), 16);
    const b = parseInt(hex.substring(4,6), 16);
    const light = (c) => Math.round(c + (255 - c) * (percent / 100));
    return `rgb(${light(r)}, ${light(g)}, ${light(b)})`;
  }

  // HTML 转义 — 防止 XSS（所有动态内容插入 innerHTML 前必须调用此函数）
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#x27;');
  }

  // 调试日志（仅开发环境输出）
  const _isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  function log(...args) { if (_isDev) console.log(...args); }
  function logErr(...args) { if (_isDev) console.error(...args); }

  // 获取状态文本
  function getStatusText(statusKey, params) {
    let text = (Brand.statusText || {})[statusKey] || statusKey;
    if (params) {
      Object.keys(params).forEach(k => { text = text.replace(`{${k}}`, params[k]); });
    }
    return text;
  }

  // ========== 原有逻辑 ==========

  // visitorId 格式：v_时间戳_随机字符串（安全生成，永不暴露）
  const MAX_MSG_LEN = 2000; // 消息最大字符数

  function getOrCreateVisitorId() {
    let id = localStorage.getItem('visitor_id');
    if (!id) {
      // 格式：v_{timestamp}_{8位随机字符串}，仅含字母数字
      id = 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('visitor_id', id);
    }
    // 防御：校验格式，防止被恶意篡改 localStorage
    if (!/^v_\d{10,}_[a-z0-9]{4,20}$/.test(id)) {
      id = 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('visitor_id', id);
    }
    return id;
  }

  // 自动撑高输入框
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  // Enter 发送
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  }

  // 快捷提问
  function quickAsk(q) {
    document.getElementById('msg-input').value = q;
    sendMsg();
  }

  // 发送消息
  async function sendMsg() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || isBusy) return;
    if (text.length > MAX_MSG_LEN) {
      alert('消息不能超过' + MAX_MSG_LEN + '字符');
      return;
    }
    
    // 检查会话是否已关闭
    if (conversationStatus === 'closed') {
      alert('会话已结束，请刷新页面开始新对话');
      return;
    }
    
    isBusy = true;
    document.getElementById('send-btn').disabled = true;
    input.value = '';
    input.style.height = 'auto';

    // 用户发送消息时，取消旧的计时器，准备启动新的
    clearRatingTimer();

    // 显示用户消息
    appendMsg('user', text);

    // 确保有对话ID
    if (!convId) {
      try {
        const r = await fetch(API + '/chat/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ visitorId, visitorName: localStorage.getItem('visitor_name') || '访客' })
        });
        const d = await r.json();
        if (d.success) {
          convId = d.conversationId;
          // 启动状态检查
          startStatusCheck();
        }
      } catch(e) { logErr('创建对话失败', e); }
    }

    // 用户发送消息后，启动评价倒计时（1分钟内无新消息则弹出评价）
    startRatingTimer();

    // 显示打字动画
    const typingId = showTyping();

    try {
      const r = await fetch(API + '/chat/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversationId: convId, message: text, visitorId })
      });
      removeTyping(typingId);

      if (!r.ok) {
        const errorData = await r.json().catch(() => ({}));
        if (errorData.code === 'CONVERSATION_CLOSED') {
          conversationStatus = 'closed';
          updateStatusDisplay();
          throw new Error('会话已结束，请刷新页面开始新对话');
        }
        if (errorData.code === 'SENSITIVE_WORD_DETECTED') {
          throw new Error('消息包含敏感内容，请修改后重试');
        }
        throw new Error(errorData.error || '服务器错误 ' + r.status);
      }
      
      const d = await r.json();
      if (!d.success) throw new Error(d.error || '服务器异常');

      // 更新会话状态
      if (d.conversation) {
        conversationStatus = d.conversation.status;
        conversationMode = d.conversation.mode || 'ai';
        if (d.conversation.agentName) {
          currentAgent = { name: d.conversation.agentName };
        }
        updateStatusDisplay();
      }

      // ====== 处理回复 ======
      if (d.type === 'streaming') {
        // ---- 流式输出：创建空气泡，连接 SSE 接收 tokens ----
        const streamId = d.streamId;
        const bubbleId = startStreamBubble();

        const evtSource = new EventSource(API + '/chat/stream/' + streamId);
        let accumulated = '';

        evtSource.addEventListener('token', function (e) {
          try {
            // 后端发送 JSON.stringify(token)，需用 JSON.parse 还原
            const token = e.data ? JSON.parse(e.data) : '';
            if (token) {
              accumulated += token;
              updateStreamBubble(bubbleId, accumulated);
            }
          } catch (err) {
            console.error('[流式] token 解析失败:', err);
          }
        });

        evtSource.addEventListener('end', function (e) {
          try {
            const data = e.data ? JSON.parse(e.data) : {};
            finalizeStreamBubble(bubbleId, accumulated || (data && data.fullContent) || '', (data && data.type) || 'ai');
          } catch (err) {
            console.error('[流式] end 解析失败:', err);
            finalizeStreamBubble(bubbleId, accumulated || '', 'ai');
          }
          evtSource.close();
        });

        evtSource.addEventListener('error', function (e) {
          evtSource.close();
          if (accumulated) {
            finalizeStreamBubble(bubbleId, accumulated, 'ai');
          } else {
            appendMsg('bot', '抱歉，AI 回复中断，请重试。');
          }
        });
      } else if (d.response && d.response.type !== 'human_pending') {
        // ---- 非流式回复：知识库命中 / 兜底 / 其他 ----
        appendMsg('bot', d.response.message, d.response.type);
      }
    } catch(e) {
      removeTyping(typingId);
      appendMsg('bot', e.message || '抱歉，服务暂时不可用，请稍后重试。\n\n如紧急需求请拨打客服热线：400-XXX-XXXX');
    }

    isBusy = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  // 启动评价倒计时
  function startRatingTimer() {
    // 如果本轮已经触发过评价，不再启动
    if (hasTriggeredRating) {
      log('[评价] 本轮已触发过评价，不再启动计时器');
      return;
    }
    // 清除之前的计时器
    clearRatingTimer();
    log('[评价] 启动1分钟倒计时，convId:', convId);
    // 启动新的1分钟倒计时
    ratingTimer = setTimeout(() => {
      log('[评价] 倒计时结束，准备弹出评价框');
      autoShowRating();
    }, RATING_DELAY);
  }

  // 清除评价计时器
  function clearRatingTimer() {
    if (ratingTimer) {
      log('[评价] 清除计时器');
      clearTimeout(ratingTimer);
      ratingTimer = null;
    }
  }

  // 自动显示评价框
  function autoShowRating() {
    log('[评价] 尝试弹出评价框，hasTriggeredRating:', hasTriggeredRating, 'convId:', convId);
    if (hasTriggeredRating) {
      log('[评价] 本轮已触发过，不弹出');
      return;
    }
    if (!convId) {
      log('[评价] 无有效对话ID，不弹出');
      return;
    }
    hasTriggeredRating = true;
    ratingTimer = null;
    log('[评价] 弹出评价框');
    // 更新评价框提示文字
    document.querySelector('.rating-box h3').textContent = '对话已结束';
    document.querySelector('.rating-box p').textContent = '您与客服的对话已结束，请对本次服务进行评价';
    openModal('rating-modal');
  }

  // 追加消息
  function appendMsg(role, text, type) {
    const container = document.getElementById('messages');
    const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    const isBot = role === 'bot';
    let extra = '';
    // 根据来源类型显示不同标签
    if (type === 'knowledge') {
      extra = '<div class="source-tag source-kb">📚 知识库</div>';
    } else if (type === 'ai') {
      extra = '<div class="source-tag source-ai">🤖 AI生成</div>';
    } else if (type === 'human') {
      extra = '<div class="source-tag source-human">👤 人工回复</div>';
    } else if (isBot) {
      extra = '<div class="source-tag source-default">💬 智能回复</div>';
    }

    const html = `
      <div class="msg ${isBot ? '' : 'user'}">
        <div class="msg-avatar ${isBot ? 'bot' : 'user'}">${isBot ? escapeHtml(Brand.logo || '🤖') : '👤'}</div>
        <div class="msg-body">
          <div class="bubble ${isBot ? 'bot' : 'user'}">${escapeHtml(text)}</div>
          ${extra}
          <div class="msg-meta">${time}</div>
        </div>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
    container.scrollTop = container.scrollHeight;
  }

  // 打字动画
  function showTyping() {
    const container = document.getElementById('messages');
    const id = 'typing-' + Date.now();
    container.insertAdjacentHTML('beforeend', `
      <div class="msg" id="${id}">
        <div class="msg-avatar bot">${escapeHtml(Brand.logo || '🤖')}</div>
        <div class="msg-body">
          <div class="typing-bubble">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>
        </div>
      </div>
    `);
    container.scrollTop = container.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // 流式输出气泡管理
  function startStreamBubble() {
    const container = document.getElementById('messages');
    const id = 'stream-' + Date.now();
    const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    container.insertAdjacentHTML('beforeend', `
      <div class="msg" id="${id}">
        <div class="msg-avatar bot">${escapeHtml(Brand.logo || '🤖')}</div>
        <div class="msg-body">
          <div class="bubble bot" id="${id}-text"></div>
          <div class="source-tag source-ai" id="${id}-tag">🤖 AI生成</div>
          <div class="msg-meta">${time}</div>
        </div>
      </div>
    `);
    container.scrollTop = container.scrollHeight;
    return id;
  }

  function updateStreamBubble(bubbleId, text) {
    const el = document.getElementById(bubbleId + '-text');
    if (el) {
      el.textContent = text;
      el.parentElement.parentElement.parentElement.scrollTop =
        el.parentElement.parentElement.parentElement.scrollHeight;
    }
  }

  function finalizeStreamBubble(bubbleId, finalText, type) {
    const textEl = document.getElementById(bubbleId + '-text');
    if (textEl) {
      textEl.textContent = finalText;
    }
    const tagEl = document.getElementById(bubbleId + '-tag');
    if (tagEl) {
      if (type === 'knowledge') {
        tagEl.className = 'source-tag source-kb';
        tagEl.textContent = '📚 知识库';
      } else if (type === 'fallback') {
        tagEl.className = 'source-tag source-default';
        tagEl.textContent = '💬 智能回复';
      } else {
        tagEl.className = 'source-tag source-ai';
        tagEl.textContent = '🤖 AI生成';
      }
    }
  }

  // 评价
  function showRating() {
    if (hasTriggeredRating) {
      document.querySelector('.rating-box h3').textContent = '对话已结束';
      document.querySelector('.rating-box p').textContent = '您与客服的对话已结束，请对本次服务进行评价';
    } else {
      document.querySelector('.rating-box h3').textContent = Brand.ratingTitle || '本次服务评价';
      document.querySelector('.rating-box p').textContent = Brand.ratingSubtitle || '您的反馈帮助我们持续改进';
    }
    openModal('rating-modal');
  }

  function selectScore(btn) {
    document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedScore = parseInt(btn.dataset.score);
  }

  async function submitRating() {
    if (!convId) { closeModal('rating-modal'); return; }
    const comment = document.getElementById('rating-comment').value;
    try {
      // 【P3-3安全修复】传递 visitorId 进行服务端校验
      await fetch(API + '/chat/rate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversationId: convId, score: selectedScore || 3, comment, visitorId })
      });
    } catch(e) {
      logErr('[评价] 提交失败:', e);
      appendMsg('bot', '评价提交失败，请稍后重试');
    }
    closeModal('rating-modal');
    // 评价后重置对话ID，新一轮对话可以再次评价
    convId = null;
    conversationStatus = 'closed';
    updateStatusDisplay();
    resetRatingState();
  }

  // 更新会话状态显示
  function updateStatusDisplay() {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    const endBtn = document.getElementById('end-btn');
    const input = document.getElementById('msg-input');

    dot.className = 'status-dot ' + conversationStatus;

    // 根据模式和状态显示（使用品牌配置的状态文本）
    if (conversationMode === 'human' && currentAgent) {
      text.textContent = getStatusText('human', { agentName: currentAgent.name });
      dot.className = 'status-dot active';
    } else if (conversationMode === 'queue') {
      text.textContent = getStatusText('queue', { position: queuePosition });
      dot.className = 'status-dot idle';
    } else {
      text.textContent = getStatusText(conversationStatus) || conversationStatus;
    }
    
    if (conversationStatus === 'closed') {
      endBtn.disabled = true;
      input.placeholder = '会话已结束，请刷新页面开始新对话';
    } else if (conversationMode === 'queue') {
      endBtn.disabled = false;
      input.placeholder = '排队中，请稍候...';
    } else if (conversationMode === 'human') {
      endBtn.disabled = false;
      input.placeholder = '输入您的问题...';
    } else {
      endBtn.disabled = false;
      input.placeholder = '输入您的问题...';
    }
  }

  // 请求转人工
  async function requestHuman() {
    if (!convId) {
      // 先创建会话
      try {
        const r = await fetch(API + '/chat/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ visitorId, visitorName: localStorage.getItem('visitor_name') || '访客' })
        });
        const d = await r.json();
        if (d.success) {
          convId = d.conversationId;
          startStatusCheck();
          connectWebSocket();
        }
      } catch(e) {
        logErr('创建对话失败', e);
        return;
      }
    }

    try {
      const r = await fetch(API + '/chat/transfer-to-human', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversationId: convId, visitorId })
      });
      const d = await r.json();
      
      if (d.success) {
        if (d.alreadyInHuman) {
          appendMsg('bot', `您已在人工服务中，当前客服：${d.agentName}`);
        } else if (d.inQueue) {
          conversationMode = 'queue';
          queuePosition = d.position;
          updateStatusDisplay();
          appendMsg('bot', d.message);
          
          // 显示取消排队按钮
          showCancelQueueButton();
        } else {
          // 直接分配
          conversationMode = 'human';
          currentAgent = d.agent;
          updateStatusDisplay();
          appendMsg('bot', d.message);
          
          // 连接WebSocket
          connectWebSocket();
        }
      } else {
        appendMsg('bot', d.message || '转人工失败，请稍后再试');
      }
    } catch(e) {
      logErr('转人工失败:', e);
      appendMsg('bot', '转人工失败，请稍后再试');
    }
  }

  // 显示取消排队按钮
  function showCancelQueueButton() {
    const container = document.getElementById('messages');
    const id = 'cancel-queue-' + Date.now();
    const html = `
      <div class="msg" id="${id}">
        <div class="msg-avatar bot">${escapeHtml(Brand.logo || '🤖')}</div>
        <div class="msg-body">
          <div class="bubble bot">
            <button onclick="cancelQueue()" style="background:#ef4444;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">取消排队</button>
          </div>
          <div class="msg-meta">${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
    container.scrollTop = container.scrollHeight;
  }

  // 取消排队
  async function cancelQueue() {
    if (!convId) return;
    
    try {
      const r = await fetch(API + '/chat/cancel-queue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversationId: convId })
      });
      const d = await r.json();
      
      if (d.success) {
        conversationMode = 'ai';
        queuePosition = 0;
        updateStatusDisplay();
        appendMsg('bot', '已取消排队，继续AI服务');
      }
    } catch(e) {
      logErr('取消排队失败:', e);
    }
  }

  // 连接WebSocket（传递 visitorId 进行服务端校验）
  function connectWebSocket() {
    if (!convId || ws) return;
    
    // 【修复】动态检测 WebSocket 协议和地址
    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsHost = location.host; // 使用当前页面 host，避免硬编码 localhost
    const wsUrl = wsProtocol + '//' + wsHost + '/ws?type=user&id=' + convId + '&visitorId=' + encodeURIComponent(visitorId);
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
      log('[WebSocket] 已连接');
    };
    
    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        handleWebSocketMessage(msg);
      } catch(e) {
        logErr('[WebSocket] 消息解析失败:', e);
      }
    };
    
    ws.onclose = () => {
      log('[WebSocket] 连接关闭');
      ws = null;
    };
    
    ws.onerror = (err) => {
      logErr('[WebSocket] 错误:', err);
    };
  }

  // 处理WebSocket消息
  function handleWebSocketMessage(msg) {
    switch(msg.type) {
      case 'agent_assigned':
        conversationMode = 'human';
        currentAgent = msg.agent;
        queuePosition = 0;
        updateStatusDisplay();
        appendMsg('bot', msg.message);
        break;
      case 'queue_update':
        queuePosition = msg.position;
        updateStatusDisplay();
        appendMsg('bot', msg.message);
        break;
      case 'agent_message':
        appendMsg('bot', msg.message, 'human');
        break;
      case 'conversation_ended':
        conversationStatus = 'closed';
        conversationMode = 'ai';
        currentAgent = null;
        updateStatusDisplay();
        appendMsg('bot', msg.message);
        if (ws) {
          ws.close();
          ws = null;
        }
        break;
    }
  }

  // 启动状态检查
  function startStatusCheck() {
    if (statusCheckTimer) clearInterval(statusCheckTimer);
    statusCheckTimer = setInterval(async () => {
      if (!convId || conversationStatus === 'closed') return;
      
      try {
        const r = await fetch(API + '/chat/status/' + convId);
        if (r.ok) {
          const d = await r.json();
          if (d.success && d.status !== conversationStatus) {
            conversationStatus = d.status;
            updateStatusDisplay();
            
            if (d.status === 'closed') {
              // 会话被关闭，显示提示
              appendMsg('bot', '会话已结束，感谢您的使用！如有其他问题，请刷新页面开始新对话。');
              clearRatingTimer();
              hasTriggeredRating = true; // 防止评价框弹出
            }
          }
        }
      } catch(e) {
        logErr('状态检查失败:', e);
      }
    }, STATUS_CHECK_INTERVAL);
  }

  // 结束会话
  async function endConversation() {
    if (!convId) {
      alert('当前没有活跃会话');
      return;
    }
    if (!confirm('确认结束当前会话？')) return;
    
    try {
      // 【P3-3安全修复】传递 visitorId 进行服务端校验
      const r = await fetch(API + '/chat/close', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversationId: convId, visitorId })
      });
      
      if (r.ok) {
        conversationStatus = 'closed';
        updateStatusDisplay();
        appendMsg('bot', '会话已结束，感谢您的使用！如有其他问题，请刷新页面开始新对话。');
        clearRatingTimer();
        hasTriggeredRating = true;
        
        // 显示评价对话框
        setTimeout(() => {
          document.querySelector('.rating-box h3').textContent = '对话已结束';
          document.querySelector('.rating-box p').textContent = '您与客服的对话已结束，请对本次服务进行评价';
          openModal('rating-modal');
        }, 500);
      }
    } catch(e) {
      logErr('结束会话失败:', e);
      alert('结束会话失败，请稍后重试');
    }
  }

  // 清空对话
  function clearChat() {
    if (!confirm('确认清空所有对话记录？这将结束当前会话。')) return;
    
    // 如果有活跃会话，先关闭
    if (convId && conversationStatus !== 'closed') {
      // 【P3-3安全修复】传递 visitorId 进行服务端校验
      fetch(API + '/chat/close', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversationId: convId, visitorId })
      }).catch(() => {});
    }
    
    document.getElementById('messages').innerHTML = `
      <div class="msg">
        <div class="msg-avatar bot">${escapeHtml(Brand.logo || '🤖')}</div>
        <div class="msg-body">
          <div class="bubble bot">对话已清空，有什么可以帮到您？</div>
          <div class="msg-meta">${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      </div>
    `;
    // 重置评价状态
    resetRatingState();
    convId = null;
    conversationStatus = 'active';
    updateStatusDisplay();
    if (statusCheckTimer) {
      clearInterval(statusCheckTimer);
      statusCheckTimer = null;
    }
  }

  // 重置评价状态
  function resetRatingState() {
    clearRatingTimer();
    hasTriggeredRating = false;
    selectedScore = 0;
    conversationStatus = 'active';
    updateStatusDisplay();
    // 重置评价框文字（使用品牌配置）
    document.querySelector('.rating-box h3').textContent = Brand.ratingTitle || '本次服务评价';
    document.querySelector('.rating-box p').textContent = Brand.ratingSubtitle || '您的反馈帮助我们持续改进';
    // 清除选中状态
    document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('rating-comment').value = '';
  }

  // 跳过评价
  function skipRating() {
    closeModal('rating-modal');
    // 标记为已触发，不再自动弹出
    hasTriggeredRating = true;
    clearRatingTimer();
  }

  function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

  document.getElementById('rating-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('hidden');
  });

  // 自动聚焦
  document.getElementById('msg-input').focus();

  // ========== 移动端增强 ==========
  
  // 键盘弹起时自动滚动到底部（iOS Safari兼容）
  const msgContainer = document.getElementById('messages');
  
  function scrollToBottom() {
    requestAnimationFrame(() => {
      if (msgContainer) {
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }
    });
  }

  // 监听输入框聚焦，延迟滚动（等待键盘弹起完成）
  const msgInput = document.getElementById('msg-input');
  if (msgInput) {
    msgInput.addEventListener('focus', () => {
      setTimeout(scrollToBottom, 300);
    });
    
    // iOS: 使用visualViewport API处理键盘弹起
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        const vh = window.visualViewport.height;
        document.documentElement.style.setProperty('--app-height', `${vh}px`);
        scrollToBottom();
      });
    }
    
    // Android: 监听resize事件
    window.addEventListener('resize', () => {
      scrollToBottom();
    });

    // 屏幕方向变化后重新适配
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        scrollToBottom();
        // 重置输入框高度
        if (msgInput) { 
          autoResize(msgInput); 
          msgInput.focus();
        }
      }, 300);
    });
  }
  
  // 触摸反馈增强
  document.querySelectorAll('.send-btn').forEach(btn => {
    btn.addEventListener('touchstart', () => btn.style.transform = 'scale(0.92)');
    btn.addEventListener('touchend', () => btn.style.transform = '');
  });

  // 防止双击缩放（已通过viewport meta实现，这里做兜底）
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, false);


  // ========== Widget 通信 ==========
  function minimizeWidget() {
    try {
      window.parent.postMessage({ type: 'csw-minimize' }, '*');
    } catch (e) {}
  }

  // 未读消息徽章：收到新消息且当前不可见时上报
  function notifyBadge(count) {
    try {
      window.parent.postMessage({ type: 'csw-badge', count: count || 1 }, '*');
    } catch (e) {}
  }

  // 监听父页面指令：open/close/send/setUser/api
  window.addEventListener('message', function (e) {
    const msg = e.data;
    if (!msg || typeof msg !== 'object') return;
    switch (msg.type) {
      case 'csw-api':
        if (msg.apiUrl) {
          sessionStorage.setItem('csw_api', msg.apiUrl);
          location.reload();
        }
        break;
      case 'csw-send':
        const input = document.getElementById('msg-input');
        if (input && msg.text) {
          input.value = msg.text;
          sendMsg();
        }
        break;
      case 'csw-set-user':
        if (msg.user && msg.user.name) {
          localStorage.setItem('visitor_name', msg.user.name);
        }
        break;
    }
  });

  // 消息到达时上报未读（人工消息触发）
  const _origAppend = appendMsg;
  appendMsg = function (role, text, type) {
    _origAppend(role, text, type);
    if (role === 'bot' && document.hidden === false) {
      // 可见时不报徽章
    }
  };

  // 加载品牌配置（页面启动时）
  loadBrandConfig();
</script>
