services:
  # ========== PostgreSQL 数据库 ==========
  postgres:
    image: postgres:16-alpine
    container_name: ai-cs-postgres
    environment:
      POSTGRES_DB: ai_customer_service
      POSTGRES_USER: ai_service
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_service -d ai_customer_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== Python LangChain AI 服务 ==========
  ai-service:
    build:
      context: ../ai-service-langchain
      dockerfile: Dockerfile
    container_name: ai-cs-langchain
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-${DEEPSEEK_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      FALLBACK_API_KEY: ${FALLBACK_API_KEY:-${ZHIPU_API_KEY:-}}
      NODE_API_BASE: http://node-service:3456
      DB_TYPE: postgres
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN must be set}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8000"
    restart: unless-stopped

  # ========== Node.js 主服务 ==========
  node-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-cs-node
    environment:
      NODE_ENV: production
      PORT: 3456
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_customer_service
      DB_USER: ai_service
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      LANGCHAIN_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${NODE_PORT:-3456}:3456"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3456/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ========== Nginx 反向代理（可选——生产环境启用）==========
  nginx:
    image: nginx:alpine
    container_name: ai-cs-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - node-service
    restart: unless-stopped
    profiles:
      - production

volumes:
  pgdata:
